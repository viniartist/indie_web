{% extends "base.html" %}

{% block content %}

{{ page.content | safe }}

<form
    id="contact-form"
    class="contact-form"
    action="https://formspree.io/f/mgodwygv"
    method="POST"
>

<div class="form-field">
    <label for="name">Nome</label>
    <input
        type="text"
        id="name"
        name="name"
        autocomplete="name"
        required
    >
</div>

<div class="form-field">
    <label for="email">E-mail</label>
    <input
        type="email"
        id="email"
        name="email"
        autocomplete="email"
        required
    >
</div>

<div class="form-field">
    <label for="subject">Assunto</label>
    <select id="subject" name="subject" required>
        <option value="" disabled selected>Selecione uma opção</option>
        <option value="Aulas de desenho">Aulas de desenho</option>
        <option value="Tattoo">Tattoo</option>
        <option value="Pintura">Pintura</option>
        <option value="Outro">Outro</option>
    </select>
</div>

<div class="form-field">
    <label for="message">Mensagem</label>
    <textarea
        id="message"
        name="message"
        rows="7"
        required
    ></textarea>
</div>

<button type="submit" id="contact-submit">
    Enviar mensagem
</button>

<p
    id="contact-status"
    class="contact-status"
    role="status"
    aria-live="polite"
></p>

</form>

<script src="/js/contact.js"></script>
{% endblock content %}
