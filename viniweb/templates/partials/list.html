<ul class="posts-list">
  {% for page in section.pages %}
    {# Verifica se a página NÃO deve ser ocultada #}
    {% if not page.extra.no_listed %}
      <li>
        <span class="post-date">{{ page.date | date(format="%d/%m/%Y") }}</span>
        <a href="{{ page.permalink }}">{{ page.title }}</a>
      </li>
    {% endif %}
  {% else %}
    <li>Nenhuma página encontrada.</li>
  {% endfor %}
</ul>
