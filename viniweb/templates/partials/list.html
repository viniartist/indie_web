<ul class="posts-list">
  {% for page in section.pages %}
    {# Verifica se a página NÃO deve ser ocultada #}
    {% if not page.extra.no_listed %}
      <li>
        <a href="{{ page.permalink }}">
        <img src="{{ get_url(path=page.extra.background) }}" alt="{{ page.title }}" class="post-image">
        {{ page.title }}:{{ page.description }}
        </a>
      </li>
    {% endif %}
  {% else %}
    <li>Nenhuma página encontrada.</li>
  {% endfor %}
</ul>
