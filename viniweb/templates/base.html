<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style.css"> 
    <title>Document</title>

<script src="/js/Hyphenopoly_Loader.js"></script>

<script>
Hyphenopoly.config({
    require: {
        "pt-br": "FORCEHYPHENOPOLY"
    },

    paths: {
        maindir: "/js/",
        patterndir: "/patterns/"
    },

    setup: {
        selectors: {
            ".prose": {}
        }
    },

    hyphen: "­",

    minWordLength: 4
});
</script>

</head>
<body>
  <div class="layout">
  {% include "partials/topmenu.html" %}

     <main class="card">
        <div class="top-card">
        <h1>{{ page.title }}</h1>
        <h3>{{ page.description }}</h3>
        </div>

        <div class="card-scroll prose" lang="pt-BR">

             {% block content %} {% endblock content %}
        </div>
        {% include "partials/menu.html" %}
    </main>

  {% include "partials/footer_page.html" %}
  </div>
   <script src="/js/menu.js"></script>
</body>
</html>
